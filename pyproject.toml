[project]
name = "genai-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jesnaaugustine", email = "jesnatrisa@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.99",
    "cryptography>=50.0.2",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "langchain-openai>=1.6.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
genai-app = "genai_app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
